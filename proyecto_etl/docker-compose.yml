# Postgres (BD destino + metadatos Airflow) y Airflow 2.10 con LocalExecutor.
# Las credenciales se leen desde .env (no incluido en la entrega).
# Nombre fijo del proyecto: evita mezclar contenedores/volúmenes con otra carpeta llamada proyecto_etl
name: inf522_e2

x-airflow: &airflow
  image: apache/airflow:2.10.5-python3.11
  env_file: .env
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: America/Santiago
    AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE: America/Santiago
    # Cifra Variables/Connections guardadas en la BD de Airflow (vacío = sin cifrado)
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow_meta
    # Airflow Connection (BD destino) y Variables (claves de API) desde el entorno
    AIRFLOW_CONN_DW_POSTGRES: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    AIRFLOW_VAR_BCCH_USER: ${BCCH_USER}
    AIRFLOW_VAR_BCCH_PASS: ${BCCH_PASS}
    AIRFLOW_VAR_MP_TICKET: ${MP_TICKET}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./sql:/opt/airflow/sql
    - ./logs:/opt/airflow/logs
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ["5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/ddl/00_init_meta.sh:/docker-entrypoint-initdb.d/00_init_meta.sh:ro
      - ./sql/ddl/01_modelo.sql:/docker-entrypoint-initdb.d/01_modelo.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  airflow-init:
    <<: *airflow
    entrypoint: /bin/bash
    command: -c "airflow db migrate && airflow users create -r Admin -u $${AIRFLOW_ADMIN_USER} -p $${AIRFLOW_ADMIN_PASSWORD} -f Admin -l INF522 -e admin@example.com || true"
    restart: "no"

  airflow-webserver:
    <<: *airflow
    command: webserver
    ports: ["8080:8080"]
    restart: unless-stopped
    depends_on:
      airflow-init: {condition: service_completed_successfully}

  airflow-scheduler:
    <<: *airflow
    command: scheduler
    restart: unless-stopped
    depends_on:
      airflow-init: {condition: service_completed_successfully}

volumes:
  pgdata:
